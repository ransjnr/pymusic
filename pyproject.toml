[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymusic-downloader"
version = "0.1.3"
description = "A Python library to download music from YouTube, SoundCloud, Spotify and more"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "pyMusic Contributors" }]
keywords = ["music", "download", "youtube", "soundcloud", "spotify", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.8"
dependencies = [
    "yt-dlp>=2023.1.1",
    "mutagen>=1.46.0",
    "requests>=2.28.0",
    "click>=8.0.0",
    "tqdm>=4.64.0",
    "colorama>=0.4.6",
    "spotipy>=2.22.0",
    "static-ffmpeg>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "responses>=0.23.0",
]

[project.scripts]
pymusic = "pymusic.cli:main"

[project.urls]
Homepage = "https://github.com/ransjnr/pymusic"
Repository = "https://github.com/ransjnr/pymusic"
Issues = "https://github.com/ransjnr/pymusic/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pymusic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
